worker_processes auto;
pid /tmp/nginx/nginx.pid;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    error_log /dev/stderr crit;
    client_body_temp_path /tmp/nginx/client;
    proxy_temp_path /tmp/nginx/proxy;
    fastcgi_temp_path /tmp/nginx/fastcgi;
    uwsgi_temp_path /tmp/nginx/uwsgi;
    scgi_temp_path /tmp/nginx/scgi;
    resolver 127.0.0.11 valid=30s ipv6=off;
    map $http_x_request_id $correlation_id {
        "~^[A-Za-z0-9_-]{1,64}$" $http_x_request_id;
        default $request_id;
    }
    server {
        listen 8080;
        root /usr/share/nginx/html;
        add_header X-Request-Id $correlation_id always;
        proxy_hide_header X-Request-Id;
        proxy_set_header X-Request-Id $correlation_id;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 20m;
        location = /healthz { default_type text/plain; return 200 "ok\n"; }
        location /auth { set $backend auth:8081; proxy_pass http://$backend$request_uri; }
        location /appointments { set $backend appointment:8082; proxy_pass http://$backend$request_uri; }
        location /reports { set $backend report:8083; proxy_pass http://$backend$request_uri; }
        location /predictions { set $backend prediction:8084; proxy_read_timeout 180s; proxy_pass http://$backend$request_uri; }
        location /ml/ { set $backend ml-service:8001; rewrite ^/ml/(.*)$ /$1 break; proxy_pass http://$backend$uri$is_args$args; }
        location / { try_files $uri $uri/ /index.html; }
    }
}
