name: Java tests and coverage
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Unit, HTTP, Testcontainers, and coverage gates
        run: mvn -B -Pdocker-integration clean verify
      - name: Coverage ratchet tests
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Publish test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-and-coverage-reports
          path: |
            **/target/site/jacoco/
            **/target/surefire-reports/*.xml
            integration-tests/target/failsafe-reports/*.xml
