
name: Java tests and coverage

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Unit, HTTP, Testcontainers, and coverage gates
        run: mvn -B -Pdocker-integration clean verify

      - name: Print actual JaCoCo line coverage
        if: ${{ !cancelled() }}
        run: |
          python - <<'PY'
          import glob
          import xml.etree.ElementTree as ET

          for path in sorted(glob.glob(
              "**/target/site/jacoco/jacoco.xml",
              recursive=True
          )):
              root = ET.parse(path).getroot()
              for c in root.findall("counter"):
                  if c.get("type") == "LINE":
                      missed = int(c.get("missed"))
                      covered = int(c.get("covered"))
                      total = missed + covered
                      ratio = covered / total if total else 0
                      print(f"{path}")
                      print(f"  Covered: {covered}")
                      print(f"  Missed: {missed}")
                      print(f"  Coverage: {ratio:.4%}")
          PY

      - name: Seed and coverage tooling tests
        if: ${{ !cancelled() }}
        run: python -m unittest discover -s scripts/tests -v

      - name: ML security and container readiness tests
        if: ${{ !cancelled() }}
        run: |
          python -m pip install \
            fastapi \
            'PyJWT>=2.10.1,<3' \
            'redis>=5,<8' \
            httpx requests

          python -m unittest discover \
            -s services/ml-service/tests -v

      - name: Publish test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-and-coverage-reports
          if-no-files-found: warn
          path: |
            **/target/site/jacoco/
            **/target/surefire-reports/*.xml
            **/target/failsafe-reports/*.xml

  docker:
    name: Docker / ${{ matrix.name }}
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: auth, dockerfile: services/auth-service/Dockerfile}
          - {name: appointment, dockerfile: services/appointment-service/Dockerfile}
          - {name: report, dockerfile: services/report-service/Dockerfile}
          - {name: prediction, dockerfile: services/prediction-service/Dockerfile}
          - {name: ml-service, dockerfile: services/ml-service/Dockerfile}
          - {name: frontend, dockerfile: frontend/Dockerfile}

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: false
          tags: ckd/${{ matrix.name }}:ci
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
